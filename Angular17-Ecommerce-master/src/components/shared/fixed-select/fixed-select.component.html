<span class="fixed-select__label" [id]="id + '-label'">{{ label }}</span>
<button
  type="button"
  class="fixed-select__button"
  [id]="id"
  aria-haspopup="listbox"
  [attr.aria-expanded]="open()"
  [attr.aria-labelledby]="id + '-label ' + id"
  (click)="toggle()">
  <span class="fixed-select__value">{{ selectedLabel }}</span>
  <i class="fa-solid fa-chevron-down" aria-hidden="true"></i>
</button>

@if (open()) {
  <ul class="fixed-select__list" role="listbox" [attr.aria-labelledby]="id + '-label'">
    @for (option of options; track option.value) {
      <li role="option" [attr.aria-selected]="option.value === value">
        <button
          type="button"
          class="fixed-select__option"
          [class.is-selected]="option.value === value"
          (click)="choose(option)">
          {{ option.label }}
        </button>
      </li>
    }
  </ul>
}
